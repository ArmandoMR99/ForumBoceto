<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relevo generacional - Fórum UPB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Capa 0: arte generativo (p5.js se monta aquí) -->
    <div id="lienzo" aria-hidden="true"></div>

    <!-- Capa 1: interfaz. Siempre por encima del canvas -->
    <div id="ui-layer">
        <header>
            <div class="logos">
                <img src="Assets/Logo%2090.png" alt="90 años UPB" id="logo-90">
                <img src="Assets/Logo%20UPB.png" alt="UPB" id="logo-upb">
            </div>
            <div class="counter" id="slide-counter">01 / 13</div>
        </header>

        <main id="contenido">
            <div class="text-column">
                <p id="slide-subtitle"></p>
                <h1 id="slide-title"></h1>
            </div>

            <div class="image-column">
                <img id="slide-image" src="" alt="" hidden>

                <div id="qr-container" hidden>
                    <div class="qr-box">
                        <div class="qr-placeholder">QR memorias</div>
                        <span>Memorias</span>
                    </div>
                    <div class="qr-box">
                        <div class="qr-placeholder">QR redes</div>
                        <span>@centrodeeventosupb</span>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <div class="nav-controls">
                <button id="btn-prev" class="nav-btn" type="button" aria-label="Anterior">&#8592;</button>
                <div id="nav-dots"></div>
                <button id="btn-next" class="nav-btn" type="button" aria-label="Siguiente">&#8594;</button>
            </div>
            <div class="hints">Flecha derecha o espacio: avanzar &nbsp;|&nbsp; Flecha izquierda: volver &nbsp;|&nbsp; F: pantalla completa</div>
        </footer>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
