<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relevo Generacional - Fórum UPB</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-layer">
        <header>
            <div class="logos">
                <!-- SVG de la UPB integrado para evitar errores de archivo -->
                <svg id="logo-main" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#ffffff" d="M20 10 h15 v90 h-15 z M45 10 h15 v90 h-15 z M70 10 h15 v90 h-15 z"/>
                    <text x="100" y="55" fill="#ffffff" font-family="Inter, sans-serif" font-size="32" font-weight="900" letter-spacing="2">UPB</text>
                    <text x="100" y="85" fill="#888888" font-family="Inter, sans-serif" font-size="16" letter-spacing="4">FÓRUM • 90 AÑOS</text>
                </svg>
            </div>
            <div class="counter" id="slide-counter">01 / 13</div>
        </header>

        <main>
            <div class="text-column">
                <p id="slide-subtitle">INTRODUCCIÓN</p>
                <h1 id="slide-title">Relevo generacional: la ventaja que nadie está aprovechando.</h1>
            </div>
            
            <div class="image-column">
                <img id="slide-image" src="" alt="Imagen de apoyo" style="display: none;">
                
                <div id="qr-container" style="display: none;">
                    <div class="qr-box">
                        <div class="qr-placeholder">QR MEMORIAS</div>
                        <span>Memorias</span>
                    </div>
                    <div class="qr-box">
                        <div class="qr-placeholder">QR REDES</div>
                        <span>@centrodeeventosupb</span>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <div class="nav-controls">
                <button id="btn-prev" type="button">&#8592;</button>
                <div id="nav-dots"></div>
                <button id="btn-next" type="button">&#8594;</button>
            </div>
            <div class="hints">
                Teclas: Espacio / &#8594; avanzar • &#8592; volver • F Pantalla Completa • Mueve el mouse para interactuar
            </div>
        </footer>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
