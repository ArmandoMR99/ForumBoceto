<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relevo Generacional - Fórum UPB</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-layer">
        
        <header>
            <div class="logos">
                <img src="assets/logo_upb.png" alt="UPB 90 Años" id="logo-main"> 
            </div>
            <div class="counter" id="slide-counter">01 / 13</div>
        </header>

        <main>
            <div class="text-column">
                <p id="slide-subtitle">INTRODUCCIÓN</p>
                <h1 id="slide-title">Relevo generacional: la ventaja que nadie está aprovechando.</h1>
            </div>
            
            <div class="image-column">
                <img id="slide-image" src="" alt="Imagen de apoyo" style="display: none;">
                
                <div id="qr-container" style="display: none;">
                    <div class="qr-box">
                        <img src="assets/qr_memorias.png" alt="QR Memorias">
                        <span>Memorias</span>
                    </div>
                    <div class="qr-box">
                        <img src="assets/qr_redes.png" alt="QR Redes">
                        <span>@centrodeeventosupb</span>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <div class="nav-controls">
                <button id="btn-prev">&lt;</button>
                <div id="nav-dots"></div>
                <button id="btn-next">&gt;</button>
            </div>
            <div class="hints">
                Espacio / ➔ avanzar • ⬅ volver • F fullscreen
            </div>
        </footer>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
