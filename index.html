<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relevo Generacional - Fórum UPB</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-layer">
        <header>
            <div class="logos">
                <img src="assets/Logo%2090.png" alt="90 Años UPB" id="logo-90">
                <img src="assets/Logo%20UPB.png" alt="UPB" id="logo-upb">
            </div>
            <div class="counter" id="slide-counter">01 / 13</div>
        </header>

        <main>
            <div class="text-column">
                <p id="slide-subtitle">INTRODUCCIÓN</p>
                <h1 id="slide-title">Relevo generacional: la ventaja que nadie está aprovechando.</h1>
            </div>
            
            <div class="image-column">
                <img id="slide-image" src="" alt="Fotografía de apoyo" style="display: none;">
                
                <div id="qr-container" style="display: none;">
                    <div class="qr-box">
                        <div class="qr-placeholder">QR MEMORIAS</div>
                        <span>Memorias</span>
                    </div>
                    <div class="qr-box">
                        <div class="qr-placeholder">QR REDES</div>
                        <span>@centrodeeventosupb</span>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <div class="nav-controls">
                <button id="btn-prev" type="button">&#8592;</button>
                <div id="nav-dots"></div>
                <button id="btn-next" type="button">&#8594;</button>
            </div>
            <div class="hints">
                Navegación: Flecha Derecha / Espacio &#8594; | Flecha Izquierda &#8592; | Tecla F: Pantalla Completa
            </div>
        </footer>
    </div>

    <script src="sketch.js"></script>
</body>
</html>
